<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA</title>
<link rel="stylesheet" href="Style.css">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>

<body>

<div class="app">

<!-- ADD PAGE -->

<div class="add-page" id="addPage">

<div class="add-header">
<span class="back" id="closeAdd">←</span>
<h2>Новое объявление</h2>
</div>

<input id="imageInput" type="file" accept="image/*" class="input">
<img id="preview" class="preview">

<input id="titleInput" class="input" type="text" placeholder="Название">
<input id="priceInput" class="input" type="number" placeholder="Цена">
<textarea id="descInput" class="input textarea" placeholder="Описание"></textarea>

<button id="publishBtn" class="publish-btn">
Опубликовать
</button>

</div>

<!-- HEADER -->
<header class="header">
<div class="logo-wrap">

<img src="IMG_5244.png" class="logo logo-light">
<img src="IMG_5243.png" class="logo logo-dark">

<div class="logo-text">LUMA</div>

</div>
<div class="header-actions">

<button class="view-btn" id="viewToggle">
☷
</button>

<button class="filter-btn" id="filterBtn">
<i class="fi fi-rr-settings-sliders"></i>
</button>

<button class="theme-btn" id="themeBtn">
🌙
</button>

</div>

</header>


<!-- FILTER OVERLAY -->
<div class="filter-overlay" id="filterOverlay"></div>

<!-- FILTER PANEL -->
<div class="filter-panel" id="filterPanel">

<h3>Фильтры</h3>

<select class="input">
<option>Категория</option>
<option>Телефоны</option>
<option>Ноутбуки</option>
<option>Консоли</option>
</select>

<select class="input">
<option>Состояние</option>
<option>Новое</option>
<option>Б/у</option>
</select>

<input class="input" placeholder="Цена до">

<button class="publish-btn">
Применить
</button>

</div>
<!-- HOME PAGE -->

<div class="page active" id="homePage">

<div class="tabs">

<div class="tab active" data-tab="feed">
Лента
</div>

<div class="tab" data-tab="near">
Рядом
</div>

<div class="tab" data-tab="auction">
Аукционы
</div>

</div>

<!-- FEED -->

<div class="tab-content active" id="feedTab">

<div id="feed">

<div class="card">
<img src="https://images.unsplash.com/photo-1603898037225-1c2f27d2c0b5?q=80&w=800">
<div class="card-body">
<div class="title">iPhone 12 Pro Max</div>
<div class="price">120 000 ₽</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1593941707874-ef25b8b4a92b?q=80&w=800">
<div class="card-body">
<div class="title">PlayStation 5</div>
<div class="price">70 000 ₽</div>
</div>
</div>

</div>

</div>

<!-- NEAR -->

<div class="tab-content" id="nearTab">
<h3 class="page-title">Объявления рядом</h3>
</div>

<!-- AUCTION -->

<div class="tab-content" id="auctionTab">

<div class="card auction">

<div class="auction-badge">
АУКЦИОН
</div>

<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=800">

<div class="card-body">
<div class="title">MacBook Pro M1</div>
<div class="price" id="bidPrice">
Текущая ставка: 45 000 ₽
</div>
<div class="timer" id="auctionTimer">
02:15:10
</div>
<div class="winner" id="winnerBlock">
Победитель: —
</div>

<input 
type="number" 
id="bidInput" 
class="input" 
placeholder="Ваша ставка">

<button class="bid-btn" id="bidBtn">
Сделать ставку
</button>
<div class="bid-list" id="bidList"></div>

</div>

</div>

</div>

</div>

<!-- FAVORITES -->

<div class="page" id="favPage">
<h2 class="page-title">Избранное</h2>
</div>

<!-- CHAT -->

<div class="page" id="chatPage">
<h2 class="page-title">Чат</h2>
</div>

<!-- PROFILE -->

<div class="page" id="profilePage">
<h2 class="page-title">Профиль</h2>
</div>

</div>

<!-- NAV -->

<nav class="bottom-nav">

<div class="nav-item active" data-page="home">
<div class="icon">⌂</div>
<span>Главная</span>
</div>

<div class="nav-item" data-page="fav">
<div class="icon">♡</div>
<span>Избранное</span>
</div>

<div class="nav-item add" data-page="add">
<div class="plus">+</div>
</div>

<div class="nav-item" data-page="chat">
<div class="icon">💬</div>
<span>Чат</span>
</div>

<div class="nav-item" data-page="profile">
<div class="icon">👤</div>
<span>Профиль</span>
</div>

</nav>

#фуллскрин

<div class="product-page" id="productPage">

<div class="product-header">
<span id="closeProduct">←</span>
</div>

<img id="productImage" class="product-image">

<div class="product-body">

<div class="product-title" id="productTitle"></div>
<div class="product-price" id="productPrice"></div>

<button class="buy-btn">
Написать продавцу
</button>

</div>

</div>
<script src="app.js"></script>

</body>
</html>
